<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FaceTrust | Demo login</title><link rel="stylesheet" href="/assets/styles.css"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f1f5f9;font-family:system-ui,sans-serif}.panel{box-sizing:border-box;width:min(440px,94vw);padding:30px;border-radius:16px;background:white;box-shadow:0 8px 40px #102a4330}.panel input,.panel button{box-sizing:border-box;width:100%;padding:13px;margin:10px 0;border-radius:8px;border:1px solid #cbd5e1}.panel button{background:#047857;color:white;border:0;font-weight:700;cursor:pointer}.panel button:disabled{opacity:.6}#error{color:#b91c1c}</style></head><body><main class="panel"><h1>FaceTrust</h1><p>Demo operator sign in</p><form id="loginForm"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">Sign in</button></form><p id="error" role="alert" aria-live="polite"></p></main><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script defer src="/assets/auth.js"></script><script defer src="/assets/login.js"></script></body></html>
